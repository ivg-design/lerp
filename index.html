<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LERP: Luau Education for Rive Professionals - Interactive course for mastering Rive scripting">
    <meta name="keywords" content="LERP, Luau, Rive, Scripting, Course, Tutorial, Animation">
    <meta name="author" content="IVG Design">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://forge.mograph.life/apps/lerp/">
    <meta property="og:title" content="LERP - Luau Education for Rive Professionals">
    <meta property="og:description" content="Interactive course for mastering Rive scripting with Luau">
    <meta property="og:image" content="https://forge.mograph.life/apps/lerp/assets/images/lerp-logo.svg">

    <title>LERP - Luau Education for Rive Professionals</title>

    <link rel="icon" href="assets/images/lerp-logo.svg" type="image/svg+xml">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f23;
            color: #cccccc;
            min-height: 100vh;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 1.5rem;
        }

        .logo {
            width: 200px;
            height: auto;
        }

        .loading-text {
            font-size: 1.125rem;
            color: #8b8b8b;
        }

        .course-frame {
            width: 100%;
            height: 100vh;
            border: none;
        }

        .header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            color: white;
            font-size: 1.25rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-links {
            display: flex;
            gap: 1rem;
        }

        .header-link {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 0.875rem;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            transition: background 0.2s;
        }

        .header-link:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .main-content {
            height: calc(100vh - 60px);
        }

        @media (max-width: 640px) {
            .header {
                flex-direction: column;
                gap: 0.75rem;
                text-align: center;
            }

            .header-links {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-title">
            <span>🎓</span>
            <span>LERP: Luau Education for Rive Professionals</span>
        </div>
        <nav class="header-links">
            <a href="https://forge.mograph.life" class="header-link">← Back to Forge</a>
            <a href="reference/api-reference.md" class="header-link" target="_blank">API Reference</a>
            <a href="reference/quick-reference.md" class="header-link" target="_blank">Quick Ref</a>
            <a href="https://github.com/ivg-design/lerp" class="header-link" target="_blank">GitHub</a>
        </nav>
    </header>

    <main class="main-content">
        <iframe
            class="course-frame"
            src="https://liascript.github.io/course/?https://forge.mograph.life/apps/lerp/course.md"
            title="LERP Interactive Course"
            loading="lazy"
        ></iframe>
    </main>

    <noscript>
        <div class="loading-container">
            <p>JavaScript is required to run the interactive course.</p>
            <p>Please enable JavaScript or use the <a href="https://liascript.github.io/course/?https://raw.githubusercontent.com/ivg-design/lerp/main/course.md">direct LiaScript link</a>.</p>
        </div>
    </noscript>
</body>
</html>
